<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174a5b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meeuwen"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><title>Meeuwen Kijken</title><style>:root{--n:#174a5b;--t:#287a77;--p:#eaf4f3;--w:#fff;--i:#16333c;--m:#60777d}*{box-sizing:border-box}body{margin:0;background:#eaf0f1;color:var(--i);font:15px/1.45 system-ui;padding-top:env(safe-area-inset-top)}.app{max-width:820px;margin:auto;background:#fff;min-height:100vh}.hero{background:var(--n);color:#fff;padding:19px}.hero h1{margin:0}.hero p{margin:3px 0 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #ccd}.tabs button{border:0;background:#fff;padding:12px;font-weight:750}.tabs .on{color:var(--t);border-bottom:3px solid var(--t)}main{padding:14px}.panel{display:none}.panel.on{display:block}.card{border:1px solid #c8d7da;border-radius:12px;padding:14px;margin-bottom:12px}.answers{display:grid;gap:8px}.answers button,.btn{border:1px solid #9db4b9;border-radius:9px;padding:12px;background:#f8fbfb;text-align:left;font:inherit;font-weight:650;color:var(--i)}.answers button:hover{background:var(--p)}.nav{display:flex;gap:8px;margin-top:12px}.btn{background:var(--n);color:#fff;text-align:center}.secondary{background:#e5ecee;color:#29474f}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.photos img{width:100%;border-radius:8px}.result{border-left:6px solid var(--t);background:var(--p)}.result h2{margin:0}.warning{border-left-color:#b04c3d;background:#fff2ee}.chip{display:inline-block;padding:4px 8px;border-radius:12px;background:#daeae8;font-size:12px;font-weight:750}.install{display:none;background:#fff5cb;border:1px solid #ead47b;padding:12px;border-radius:10px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.species img{width:100%;border-radius:8px}.small{font-size:12px;color:var(--m)}@media(max-width:540px){.grid,.photos{grid-template-columns:1fr}.tabs button{font-size:13px}}</style></head><body><div class="app"><header class="hero"><h1>Meeuwen Kijken</h1><p>Soort bepalen en daarna exact één kalenderjaar</p></header><nav class="tabs"><button class="on" data-tab="key">Sleutel</button><button data-tab="learn">Leren</button><button data-tab="compare">Vergelijk</button></nav><main><div id="install" class="install"><b>Installeer op iPhone:</b> Safari → Deel → Zet op beginscherm → Open als webapp.</div><section id="key" class="panel on"><div id="screen"></div><div class="nav"><button id="back" class="btn">← Terug</button><button id="reset" class="btn secondary">↻ Opnieuw</button></div></section><section id="learn" class="panel"><div id="cards" class="grid"></div></section><section id="compare" class="panel"><div class="card"><h2>Leeftijdsvergelijking grote meeuwen</h2><img src="assets/p89.jpg" style="width:100%;border-radius:8px"><p class="small">Vergelijk handpennen, armpennen, dekveren, schouderveren, staart, snavel, poten en oog.</p></div><div class="card"><h2>Eerstejaars grote meeuwen</h2><div class="photos"><img src="assets/p83.jpg"><img src="assets/p84.jpg"></div></div></section></main></div><script>
const $=s=>document.querySelector(s);document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.tab).classList.add('on')});
const species={Kokmeeuw:{adult:'p32.jpg',young:'p35.jpg',ages:[['1e kalenderjaar','p35.jpg','p36.jpg',['juveniele vleugel/staart','donkere snavelpunt','bruine of juveniele dekveren']],['2e kalenderjaar','p36.jpg','p37.jpg',['eerste-generatie vleugelresten','variabele kopkap','nog niet volledig adult']],['adult','p32.jpg','p34.jpg',['adult vleugelpatroon','rode poten/snavel','complete seizoenskop']]]},Stormmeeuw:{adult:'p41.jpg',young:'p43.jpg',ages:[['1e kalenderjaar','p43.jpg','p44.jpg',['spitse handpennen','zwarte staartband','rozige snavel/poten']],['2e kalenderjaar','p44.jpg','p45.jpg',['ronde handpentoppen','kleine witte toppen','onvolwassen vleugel']],['3e kalenderjaar','p45.jpg','p42.jpg',['vrijwel adult','kleine spiegels','restzwart handdekveren']],['adult','p41.jpg','p42.jpg',['grote witte toppen','adult staart','adult snavel/poten']]]},Zilvermeeuw:{adult:'p49.jpg',young:'p51.jpg',ages:[['1e kalenderjaar','p51.jpg','p52.jpg',['spitse handpennen','gekartelde tertials','donkere snavel','donkere staartband']],['2e kalenderjaar','p52.jpg','p53.jpg',['ronde handpentoppen','fijner dekveerpatroon','lichte snavelbasis']],['3e kalenderjaar','p53.jpg','p54.jpg',['adulttype slagpennen','kleine spiegel','bruin in dekveren/staart']],['4e kalenderjaar','p54.jpg','p55.jpg',['vrijwel adult','donkere handpendekveren','extra snaveltekening']],['adult','p49.jpg','p50.jpg',['volledig adult slagpenpatroon','witte staart','gele snavel met gonysvlek']]]},'Kleine mantelmeeuw':{adult:'p59.jpg',young:'p61.jpg',ages:[['1e kalenderjaar','p61.jpg','p62.jpg',['donkere binnenste handpennen','lange vleugel','donkere tertials']],['2e kalenderjaar','p62.jpg','p63.jpg',['deels leigrijze schouderveren','poten nog rozeachtig','tweede generatie slagpennen']],['3e kalenderjaar','p63.jpg','p64.jpg',['adultachtig donker','kleine spiegel','duidelijke onvolwassen resten']],['4e kalenderjaar','p64.jpg','p65.jpg',['vrijwel adult','slechts enkele onvolwassen veren']],['adult','p59.jpg','p60.jpg',['adult leigrijze mantel','gele poten','adult vleugelpatroon']]]},'Grote mantelmeeuw':{adult:'p69.jpg',young:'p71.jpg',ages:[['1e kalenderjaar','p71.jpg','p72.jpg',['bont juveniel patroon','puntige handpennen','smalle zwarte eindband']],['2e kalenderjaar','p72.jpg','p73.jpg',['ronde handpentoppen','deels zwartachtige schouderveren','kleine spiegel p10 mogelijk']],['3e kalenderjaar','p73.jpg','p74.jpg',['adultachtig zwart','twee spiegels','nog onvolwassen resten']],['4e kalenderjaar','p74.jpg','p75.jpg',['grotendeels adult','enkele bruine dekveren','rozeachtige snavel mogelijk']],['adult','p69.jpg','p70.jpg',['volledig zwarte bovendelen','witte staart','grote spiegels']]]}};
$('#cards').innerHTML=Object.entries(species).map(([n,d])=>`<article class="card species"><h2>${n}</h2><div class="photos"><div><img src="assets/${d.adult}"><b>Adult</b></div><div><img src="assets/${d.young}"><b>Jong</b></div></div></article>`).join('');
const Q={start:['Welke groottegroep?',[['Klein','small'],['Middelgroot','storm'],['Groot','large'],['Zeer groot en zwaar','gbb']]],small:['Welke combinatie past?',[['Lichte vleugelvoorrand, kleine meeuw','Kokmeeuw'],['Middelgroot, fijne snavel','Stormmeeuw']]],storm:['Rond kopje, fijne snavel, middelgrote bouw?',[['Ja','Stormmeeuw'],['Nee','large']]],large:['Welke combinatie past?',[['Lichtgrijze mantel of jonge vogel met gekartelde tertials','Zilvermeeuw'],['Donkere mantel of jonge langvleugelige vogel','Kleine mantelmeeuw'],['Zeer zwaar en bont/zwart','Grote mantelmeeuw']]],gbb:['Zeer grote zware vogel met zware snavel?',[['Ja','Grote mantelmeeuw'],['Nee','large']]]};let hist=[],mode='species',node='start',selected=null,month=null,ageStep=0,scores=[];
function draw(){if(mode==='species'){let q=Q[node];if(!q){selected=node;return showSpecies()}$('#screen').innerHTML=`<div class="card"><h2>${q[0]}</h2><div class="answers">${q[1].map(x=>`<button data-n="${x[1]}">${x[0]}</button>`).join('')}</div></div>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{hist.push({mode,node});node=b.dataset.n;draw()})}}
function showSpecies(){let d=species[selected];$('#screen').innerHTML=`<div class="card result"><h2>${selected}</h2><div class="photos"><img src="assets/${d.adult}"><img src="assets/${d.young}"></div><button id="age" class="btn" style="width:100%;margin-top:10px">Kalenderjaar bepalen →</button></div>`;$('#age').onclick=()=>{hist.push({mode,node,selected});mode='month';drawMonth()}}
function drawMonth(){let ms=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];$('#screen').innerHTML=`<div class="card"><h2>Maand van waarneming</h2><div class="answers">${ms.map((m,i)=>`<button data-m="${i}">${m}</button>`).join('')}</div></div>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{month=+b.dataset.m;mode='age';ageStep=0;scores=species[selected].ages.map(()=>({yes:0,no:0,seen:0}));drawAge()})}
function drawAge(){let ages=species[selected].ages;if(ageStep>=ages.length)return finish();let a=ages[ageStep];let photos=ages.map(x=>`<div><img src="assets/${x[month>=4&&month<=7?1:2]}"><b>${x[0]}</b></div>`).join('');$('#screen').innerHTML=`<div class="card"><span class="chip">${selected} · leeftijd ${ageStep+1}/${ages.length}</span><div class="photos" style="margin:10px 0">${photos}</div><h2>Past vooral ${a[0]}?</h2><p>${a[3].join(' · ')}</p><div class="answers"><button data-v="yes">Ja, overtuigend</button><button data-v="maybe">Gedeeltelijk</button><button data-v="no">Nee</button><button data-v="skip">Niet zichtbaar</button></div></div>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{let x=scores[ageStep];if(b.dataset.v==='yes'){x.yes=3;x.seen=1}else if(b.dataset.v==='maybe'){x.yes=1;x.seen=1}else if(b.dataset.v==='no'){x.no=2;x.seen=1}ageStep++;drawAge()})}
function finish(){let ages=species[selected].ages;let ranked=scores.map((x,i)=>({i,score:x.yes-x.no,seen:x.seen})).sort((a,b)=>b.score-a.score);let a=ranked[0],b=ranked[1];let unique=a.seen&&a.score>=2&&a.score>b.score;if(!unique){$('#screen').innerHTML=`<div class="card result warning"><h2>Kalenderjaar niet betrouwbaar te bepalen</h2><p>Er is geen unieke leeftijdscategorie. De app geeft daarom bewust geen combinatie van kalenderjaren. Bekijk extra kenmerken en probeer opnieuw.</p><button id="again" class="btn">Opnieuw beoordelen</button></div>`;$('#again').onclick=()=>{ageStep=0;scores=ages.map(()=>({yes:0,no:0,seen:0}));drawAge()};return}let d=ages[a.i];$('#screen').innerHTML=`<div class="card result"><h2>${selected}: ${d[0]}</h2><div class="photos"><img src="assets/${d[1]}"><img src="assets/${d[2]}"></div><p><b>Ondersteunende kenmerken:</b> ${d[3].join(', ')}.</p><p class="small">De app toont altijd precies één kalenderjaar, of geen uitkomst als de kenmerken niet uniek zijn.</p></div>`}
$('#back').onclick=()=>{let h=hist.pop();if(!h)return;mode=h.mode;node=h.node;selected=h.selected||selected;draw()};$('#reset').onclick=()=>{hist=[];mode='species';node='start';selected=null;draw()};draw();const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode:standalone)').matches;if(ios&&!standalone)$('#install').style.display='block';if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
