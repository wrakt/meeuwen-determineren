<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174a5b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>Meeuwen Exact v4</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f4;color:#16333c;font:16px/1.45 system-ui}.app{max-width:720px;margin:auto;background:white;min-height:100vh}.head{background:#174a5b;color:white;padding:20px}.body{padding:16px}.card{border:1px solid #bfd0d3;border-radius:12px;padding:16px;margin-bottom:12px}.answers{display:grid;gap:9px}.answers button,.btn{padding:13px;border:1px solid #96afb4;border-radius:9px;background:#f8fbfb;text-align:left;font:inherit;font-weight:650}.result{background:#eaf4f3;border-left:6px solid #287a77}.warn{background:#fff1ed;border-left-color:#a84b3e}.nav{display:flex;gap:8px}.btn{background:#174a5b;color:white;text-align:center}.minor{background:#e7edef;color:#28454c}.tag{display:inline-block;background:#d9ebe8;border-radius:14px;padding:4px 9px;font-size:12px;font-weight:750}.photoChoices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.photoCard{border:2px solid #c7d6d9;border-radius:11px;overflow:hidden;background:#fff}.photoCard.selected{border-color:#287a77;box-shadow:0 0 0 2px #cde7e4}.photoCard img{width:100%;height:160px;object-fit:cover;display:block}.photoCard div{padding:9px}.checks{display:grid;gap:7px;margin:12px 0}.check{padding:9px;border-radius:8px;background:#edf5f4}.confirmBtns{display:grid;gap:8px}@media(max-width:520px){.photoChoices{grid-template-columns:1fr}.photoCard img{height:210px}}</style></head><body><main class="app"><header class="head"><h1>Meeuwen Exact v4</h1><p>Eerst soortgroep en soort, daarna exact één kalenderjaar</p></header><div class="body"><div id="screen"></div><div class="nav"><button id="back" class="btn">← Terug</button><button id="reset" class="btn minor">↻ Opnieuw</button></div></div></main><script>
const $=s=>document.querySelector(s),months=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const maxAge={'Kokmeeuw':2,'Stormmeeuw':3,'Zilvermeeuw':4,'Kleine mantelmeeuw':4,'Grote mantelmeeuw':4};
const trees={
'Kokmeeuw':{start:['Zijn vleugel en staart juveniel getekend?',[['Ja','cycle1'],['Nee, volledig adult','adult'],['Niet zichtbaar','unknown']]]},
'Stormmeeuw':{start:['Zijn handpennen puntig en is een zwarte staartband aanwezig?',[['Ja','cycle1'],['Nee, handpentoppen rond','round'],['Niet zichtbaar','unknown']]],round:['Zijn kleine witte toppen/spiegels en zwart in handdekveren aanwezig?',[['Ja','cycle2'],['Nee, vrijwel adult','older'],['Twijfel','unknown']]],older:['Zijn nog duidelijke onvolwassen vleugelresten aanwezig?',[['Ja','cycle3'],['Nee','adult'],['Niet zichtbaar','unknown']]]},
'Zilvermeeuw':{start:['Zijn handpennen puntig en juveniel donkerbruin?',[['Ja','cycle1'],['Nee, handpentoppen rond','round'],['Niet zichtbaar','unknown']]],round:['Zijn slagpennen volledig onvolwassen, zonder adulttype witte toppen/spiegel?',[['Ja','cycle2'],['Nee, adulttype slagpennen','adultFlight'],['Twijfel','unknown']]],adultFlight:['Zijn bruine dekveren/tertials of zwarte staartveren duidelijk aanwezig?',[['Ja','cycle3'],['Nee of nauwelijks','nearAdult'],['Niet zichtbaar','unknown']]],nearAdult:['Zijn zwarte handpendekveren of extra donkere snaveltekening aanwezig?',[['Ja','cycle4'],['Nee','adult'],['Twijfel','unknown']]]},
'Kleine mantelmeeuw':{start:['Zijn handpennen juveniel donker en tertials donker?',[['Ja','cycle1'],['Nee, nieuwe generatie handpennen','round'],['Niet zichtbaar','unknown']]],round:['Zijn schouderveren deels leigrijs, poten rozeachtig en vleugelveren onvolwassen?',[['Ja','cycle2'],['Nee, grotendeels adultachtig','older'],['Twijfel','unknown']]],older:['Zijn duidelijke onvolwassen veren of slechts een kleine spiegel aanwezig?',[['Ja','cycle3'],['Nee, hooguit enkele resten','nearAdult'],['Niet zichtbaar','unknown']]],nearAdult:['Zijn nog enkele onvolwassen veren aanwezig?',[['Ja','cycle4'],['Nee','adult'],['Twijfel','unknown']]]},
'Grote mantelmeeuw':{start:['Zijn handpennen puntig en is het vleugelkleed bont juveniel?',[['Ja','cycle1'],['Nee, handpentoppen rond','round'],['Niet zichtbaar','unknown']]],round:['Zijn schouderveren slechts deels zwartachtig en ontbreekt een grote volwassen spiegel?',[['Ja','cycle2'],['Nee, grotendeels adultzwart','older'],['Twijfel','unknown']]],older:['Zijn twee spiegels én duidelijke onvolwassen veerpartijen aanwezig?',[['Ja','cycle3'],['Nee, vrijwel adult','nearAdult'],['Niet zichtbaar','unknown']]],nearAdult:['Zijn bruinige vleugeldekveren of onvolwassen snaveltekening aanwezig?',[['Ja','cycle4'],['Nee','adult'],['Twijfel','unknown']]]}
};
const speciesTree={
 start:['Is het een kleine/middelgrote meeuw of een grote meeuw?',[['Kleine of middelgrote meeuw','small'],['Grote meeuw','large'],['Niet goed te beoordelen','speciesUnknown']]],
 small:['Welke grootte en bouw passen het beste?',[['Klein en sierlijk, dunne snavel, lichte vleugelvoorrand','Kokmeeuw'],['Middelgroot, rond kopje, fijne snavel','Stormmeeuw'],['Geen van beide / twijfel','speciesUnknown']]],
 large:['Is de vogel uitzonderlijk groot en zwaar gebouwd, met een zeer zware snavel?',[['Ja','Grote mantelmeeuw'],['Nee','large2'],['Niet goed te beoordelen','speciesUnknown']]],
 large2:['Welke combinatie past het beste?',[['Lichtgrijze adultmantel of jonge vogel met duidelijk gekartelde tertials en licht handpenvenster','Zilvermeeuw'],['Donkere adultmantel of jonge langvleugelige, chocoladebruine vogel met donkere binnenste handpennen','Kleine mantelmeeuw'],['Zeer zwaar, zwart of opvallend bont met veel wit','Grote mantelmeeuw'],['Geen van deze / twijfel','speciesUnknown']]]
};
const speciesInfo={
 'Kokmeeuw':{img:'kokmeeuw.jpg',group:'klein/middelgroot',points:['klein en sierlijk','dunne snavel','lichte vleugelvoorrand']},
 'Stormmeeuw':{img:'stormmeeuw.jpg',group:'klein/middelgroot',points:['middelgroot','rond kopje','fijne snavel']},
 'Zilvermeeuw':{img:'zilvermeeuw.jpg',group:'groot',points:['forse bouw','adult lichtgrijs','jong vaak gekartelde tertials en licht handpenvenster']},
 'Kleine mantelmeeuw':{img:'kleine_mantelmeeuw.jpg',group:'groot',points:['slank en langvleugelig','adult donkere mantel','jong chocoladebruin met donkere binnenste handpennen']},
 'Grote mantelmeeuw':{img:'grote_mantelmeeuw.jpg',group:'groot',points:['uitzonderlijk groot','zeer zware snavel','adult zwart of jong opvallend bont']}
};let sp=null,month=null,node='start',speciesNode='start',trail=[];
function chooseSpecies(){speciesNode='start';drawSpeciesQuestion()}
function drawSpeciesQuestion(){if(speciesNode==='speciesUnknown')return speciesUnknown();if(trees[speciesNode]){sp=speciesNode;return showSpeciesResult()}let q=speciesTree[speciesNode];$('#screen').innerHTML=`<section class="card"><span class="tag">Soortbepaling</span><h2>${q[0]}</h2><div class="answers">${q[1].map(x=>`<button data-n="${x[1]}">${x[0]}</button>`).join('')}</div></section>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{trail.push(['speciesNode',speciesNode]);speciesNode=b.dataset.n;drawSpeciesQuestion()})}
function showSpeciesResult(){let i=speciesInfo[sp];let alternatives=Object.keys(speciesInfo).filter(x=>speciesInfo[x].group===i.group);$('#screen').innerHTML=`<section class="card result"><span class="tag">Controle soortkeuze</span><h2>Voorlopige soort: ${sp}</h2><div class="photoChoices">${alternatives.map(x=>`<article class="photoCard ${x===sp?'selected':''}"><img src="assets/${speciesInfo[x].img}" alt="Referentiefoto ${x}"><div><b>${x}</b>${x===sp?'<br><small>Voorlopige keuze</small>':''}</div></article>`).join('')}</div><h3>Controleer deze kenmerken</h3><div class="checks">${i.points.map(x=>`<div class="check">✓ ${x}</div>`).join('')}</div><div class="confirmBtns"><button id="speciesYes" class="btn">Ja, dit past overtuigend</button><button id="speciesNo" class="btn minor">Nee, terug naar soortvragen</button><button id="speciesDoubt" class="btn minor">Twijfel, geen soort bepalen</button></div></section>`;$('#speciesYes').onclick=()=>{trail.push(['speciesResult']);chooseMonth()};$('#speciesNo').onclick=()=>{speciesNode='start';drawSpeciesQuestion()};$('#speciesDoubt').onclick=speciesUnknown}
function speciesUnknown(){$('#screen').innerHTML=`<section class="card result warn"><h2>Soort niet betrouwbaar te bepalen</h2><p>De zichtbare kenmerken passen niet overtuigend bij één van de vijf soorten. De app start daarom niet met kalenderjaarbepaling.</p><button id="retrySpecies" class="btn">Soort opnieuw beoordelen</button></section>`;$('#retrySpecies').onclick=chooseSpecies}
function chooseMonth(){$('#screen').innerHTML=`<section class="card"><h2>Kies de waarnemingsmaand</h2><div class="answers">${months.map((x,i)=>`<button data-m="${i}">${x}</button>`).join('')}</div></section>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{trail.push(['month']);month=+b.dataset.m;node='start';question()})}
function question(){if(node==='unknown')return noResult();if(node==='adult'||node.startsWith('cycle'))return result(node);let q=trees[sp][node];$('#screen').innerHTML=`<section class="card"><span class="tag">${sp} · ${months[month]}</span><h2>${q[0]}</h2><div class="answers">${q[1].map(x=>`<button data-n="${x[1]}">${x[0]}</button>`).join('')}</div></section>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{trail.push(['node',node]);node=b.dataset.n;question()})}
function exactYear(outcome){if(outcome==='adult')return 'adult';let cycle=+outcome.slice(5);let cy=month<=4?cycle+1:cycle;return cy>maxAge[sp]?'adult':`${cy}e kalenderjaar`}
function result(outcome){let label=exactYear(outcome);$('#screen').innerHTML=`<section class="card result"><h2>${sp}: ${label}</h2><p><b>Één unieke uitkomst.</b> De veergeneratie en waarnemingsmaand zijn samen omgerekend naar exact één kalenderjaar.</p></section>`}
function noResult(){$('#screen').innerHTML=`<section class="card result warn"><h2>Kalenderjaar niet betrouwbaar te bepalen</h2><p>De noodzakelijke kenmerken zijn onvoldoende zichtbaar. De app toont daarom geen kalenderjaar en ook geen reeks mogelijkheden.</p></section>`}
$('#back').onclick=()=>{let x=trail.pop();if(!x)return;if(x[0]==='node'){node=x[1];question()}else if(x[0]==='month'||x[0]==='speciesResult'){showSpeciesResult()}else if(x[0]==='speciesNode'){speciesNode=x[1];drawSpeciesQuestion()}else chooseSpecies()};$('#reset').onclick=()=>{sp=null;month=null;node='start';speciesNode='start';trail=[];chooseSpecies()};chooseSpecies();if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
