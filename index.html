const Q={start:['Welke groottegroep?',[['Klein','small'],['Middelgroot','storm'],['Groot','large'],['Zeer groot en zwaar','gbb']]],small:['Welke combinatie past?',[['Lichte vleugelvoorrand, kleine meeuw','Kokmeeuw'],['Middelgroot, fijne snavel','Stormmeeuw']]],storm:['Rond kopje, fijne snavel, middelgrote bouw?',[['Ja','Stormmeeuw'],['Nee','large']]],large:['Welke combinatie past?',[['Lichtgrijze mantel of jonge vogel met gekartelde tertials','Zilvermeeuw'],['Donkere mantel of jonge langvleugelige vogel','Kleine mantelmeeuw'],['Zeer zwaar en bont/zwart','Grote mantelmeeuw']]],gbb:['Zeer grote zware vogel met zware snavel?',[['Ja','Grote mantelmeeuw'],['Nee','large']]]};let hist=[],mode='species',node='start',selected=null,month=null,ageStep=0,scores=[];
function draw(){if(mode==='species'){let q=Q[node];if(!q){selected=node;return showSpecies()}$('#screen').innerHTML=`<div class="card"><h2>${q[0]}</h2><div class="answers">${q[1].map(x=>`<button data-n="${x[1]}">${x[0]}</button>`).join('')}</div></div>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{hist.push({mode,node});node=b.dataset.n;draw()})}}
function showSpecies(){let d=species[selected];$('#screen').innerHTML=`<div class="card result"><h2>${selected}</h2><div class="photos"><img src="assets/${d.adult}"><img src="assets/${d.young}"></div><button id="age" class="btn" style="width:100%;margin-top:10px">Kalenderjaar bepalen →</button></div>`;$('#age').onclick=()=>{hist.push({mode,node,selected});mode='month';drawMonth()}}
function drawMonth(){let ms=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];$('#screen').innerHTML=`<div class="card"><h2>Maand van waarneming</h2><p class="small">De maand bepaalt welke leeftijdskleden mogelijk en bruikbaar zijn.</p><div class="answers">${ms.map((m,i)=>`<button data-m="${i}">${m}</button>`).join('')}</div></div>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{month=+b.dataset.m;mode='age';startConsistentAge()})}
const ageTrees={
'Kokmeeuw':{start:{q:'Zijn vleugel en staart nog duidelijk juveniel, met donkere carpaalband en donkere staartband?',img:'p36.jpg',a:[['Ja','young'],['Nee','adultCheck'],['Niet zichtbaar','unknown']]},young:{q:'Is het vóór 1 januari of ziet de vogel er vers juveniel uit?',img:'p35.jpg',a:[['Ja','r1'],['Nee','r2'],['Twijfel','unknown']]},adultCheck:{q:'Zijn vleugel en staart volledig adult zonder juveniele donkere resten?',img:'p32.jpg',a:[['Ja','radult'],['Nee','r2'],['Niet zichtbaar','unknown']]},results:{r1:'1e kalenderjaar',r2:'2e kalenderjaar',radult:'adult'}},
'Stormmeeuw':{start:{q:'Zijn de handpennen donker en duidelijk puntig, met een zwarte staartband?',img:'p44.jpg',a:[['Ja','r1'],['Nee, handpentoppen zijn rond','round'],['Niet zichtbaar','unknown']]},round:{q:'Zijn er nog kleine witte toppen, zwart in handpendekveren en kleine spiegels?',img:'p45.jpg',a:[['Ja','r2'],['Nee, vleugel vrijwel adult','adultish'],['Niet zichtbaar','unknown']]},adultish:{q:'Zijn nog duidelijke onvolwassen resten in vleugel of staart aanwezig?',img:'p45.jpg',a:[['Ja','r3'],['Nee','radult'],['Twijfel','unknown']]},results:{r1:'1e kalenderjaar',r2:'2e kalenderjaar',r3:'3e kalenderjaar',radult:'adult'}},
'Zilvermeeuw':{start:{q:'Zijn de handpennen nog puntig en juveniel donkerbruin?',img:'p51.jpg',a:[['Ja','r1'],['Nee, handpentoppen zijn rond','round'],['Niet zichtbaar','unknown']]},round:{q:'Zijn slagpennen nog geheel onvolwassen, zonder adulttype witte toppen en spiegel?',img:'p53.jpg',a:[['Ja','r2'],['Nee, adulttype slagpennen aanwezig','adultFlight'],['Twijfel','unknown']]},adultFlight:{q:'Zijn er nog bruine patronen in dekveren/tertials of zwarte veren in de staart?',img:'p54.jpg',a:[['Ja, duidelijk','r3'],['Nee of nauwelijks','nearAdult'],['Niet zichtbaar','unknown']]},nearAdult:{q:'Zijn zwarte vlekken in handpendekveren of extra donkere snaveltekening aanwezig?',img:'p55.jpg',a:[['Ja','r4'],['Nee, volledig adult','radult'],['Twijfel','unknown']]},results:{r1:'1e kalenderjaar',r2:'2e kalenderjaar',r3:'3e kalenderjaar',r4:'4e kalenderjaar',radult:'adult'}},

let ageNode='start',ageTrail=[];
function startConsistentAge(){ageNode='start';ageTrail=[];drawConsistentAge()}
function drawConsistentAge(){let t=ageTrees[selected];if(ageNode==='unknown')return noAge();if(t.results[ageNode])return ageResult(t.results[ageNode]);let q=t[ageNode];$('#screen').innerHTML=`<div class="card"><span class="chip">${selected} · ${['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'][month]}</span><img src="assets/${q.img}" style="width:100%;border-radius:8px;margin:10px 0"><h2>${q.q}</h2><div class="answers">${q.a.map(x=>`<button data-next="${x[1]}">${x[0]}</button>`).join('')}</div></div>`;$('#screen').querySelectorAll('button').forEach(b=>b.onclick=()=>{ageTrail.push(ageNode);ageNode=b.dataset.next;drawConsistentAge()})}
function ageResult(label){let d=species[selected].ages.find(x=>x[0]===label);if(!d)return noAge();$('#screen').innerHTML=`<div class="card result"><h2>${selected}: ${label}</h2><div class="photos"><img src="assets/${d[1]}"><img src="assets/${d[2]}"></div><p><b>Ondersteunende kenmerken:</b> ${d[3].join(', ')}.</p><p class="small">De antwoorden vormden één consistente route. Tegenstrijdige leeftijdskeuzes kunnen binnen deze route niet tegelijk worden geselecteerd.</p></div>`}
function noAge(){$('#screen').innerHTML=`<div class="card result warning"><h2>Kalenderjaar niet betrouwbaar te bepalen</h2><p>Een noodzakelijk leeftijdskenmerk was niet zichtbaar of bleef twijfelachtig. De app kiest daarom geen kalenderjaar.</p><button id="retryAge" class="btn">Opnieuw met andere waarneming/foto</button></div>`;$('#retryAge').onclick=startConsistentAge}
$('#back').onclick=()=>{if(mode==='age'&&ageTrail.length){ageNode=ageTrail.pop();drawConsistentAge();return}let h=hist.pop();if(!h)return;mode=h.mode;node=h.node;selected=h.selected||selected;draw()};$('#reset').onclick=()=>{hist=[];mode='species';node='start';selected=null;draw()};draw();const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=navigator.standalone||matchMedia('(display-mode:standalone)').matches;if(ios&&!standalone)$('#install').style.display='block';if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js');
